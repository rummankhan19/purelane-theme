name: CI
on: [push]
jobs:
  # Dawn's Lighthouse job is removed: it needs store credentials stored as repo
  # secrets and failed on every push without them. Lighthouse is run manually
  # against the live store instead.
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    # The action posts its results as a GitHub check run, which needs write
    # access to checks. The default token is read-only, which caused
    # "Resource not accessible by integration".
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}

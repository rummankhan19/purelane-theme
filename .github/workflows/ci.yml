name: CI
on: [push]
jobs:
  # Dawn's Lighthouse job is removed: it needs store credentials stored as repo
  # secrets and failed on every push without them. Lighthouse is run manually
  # against the live store instead.
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
